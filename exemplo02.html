<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo 02</title>
    <link rel="stylesheet" href="estilo.css">
    <style>
        ul{
            list-style: none;
            margin: 0;
            padding: 0;
        }
        li{
            border: 1px solid blue;
            background-color: rgb(252, 222, 158);
            padding: 0.5em;
        }
        .desconstructed-pancake{
            display: flex;
            flex-wrap: wrap;
        }
        .desconstructed-pancake > * {
            /* flex-grow: 1;
            flex-shrink: 0;
            flex-basis: 100px; */
            flex: 1 1 100px;
        }
    </style>
</head>
<body>
    <main>
            <h1>Exemplo 02: Descontructed Pancake</h1>
        <article>
            <ul class="desconstructed-pancake">
                <li>Primeiro</li>
                <li>Segundo</li>
                <li>Terceiro</li>
                <li>Quarto</li>
                <li>Quinto</li>
            </ul>
        </article>
    </main>
</body>
</html>
